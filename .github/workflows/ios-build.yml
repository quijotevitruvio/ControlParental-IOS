name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Clean extended attributes
        run: |
          xattr -cr .

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          ls -la InstitutionalApp.xcodeproj

      - name: Build iOS App (.app)
        run: |
          echo "=== Building InstitutionalApp without signing ==="
          set +e
          xcodebuild build \
            -project InstitutionalApp.xcodeproj \
            -scheme InstitutionalApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO > build.log 2>&1
          STATUS=$?
          echo "xcodebuild exit code: $STATUS"
          tail -n 80 build.log
          if [ $STATUS -ne 0 ]; then
            echo "Build failed with exit code $STATUS"
            exit $STATUS
          fi

      - name: Report log to issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Build Failure Log $(date)" --body-file build.log || true

      - name: Package IPA
        run: |
          echo "=== Locating .app and packaging into IPA ==="
          APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app directory not found"
            find build/DerivedData -type d
            exit 1
          fi

          rm -rf build/Payload InstitutionalApp.ipa
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/

          if [ -f InstitutionalApp.entitlements ]; then
            cp InstitutionalApp.entitlements build/Payload/InstitutionalApp.app/
          fi

          cd build
          zip -r ../InstitutionalApp.ipa Payload/
          cd ..
          echo "=== IPA created successfully ==="
          ls -lh InstitutionalApp.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstitutionalApp-iOS-ipa
          path: InstitutionalApp.ipa
          retention-days: 14

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "InstitutionalApp iOS v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ## InstitutionalApp iOS v1.0.0
            
            Archivo IPA listo para instalar en iPhone/iPad.
            
            ### Métodos de instalación:
            1. **Sideloadly / AltStore**: Carga el archivo `.ipa`, ingresa tu Apple ID y se instala directo por USB o Wi-Fi.
            2. **TrollStore**: Si tu versión de iOS lo soporta, instala el `.ipa` directamente sin caducidad.
            3. **Apple Configurator / MDM**: Despliega como app institucional.
          files: InstitutionalApp.ipa
