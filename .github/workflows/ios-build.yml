name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Clean extended attributes
        run: |
          xattr -cr .

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          ls -la InstitutionalApp.xcodeproj

      - name: Build iOS App (.app)
        run: |
          echo "=== Building InstitutionalApp with ad-hoc signing ==="
          set +e
          xcodebuild build \
            -project InstitutionalApp.xcodeproj \
            -scheme InstitutionalApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO > build.log 2>&1
          STATUS=$?
          echo "xcodebuild exit code: $STATUS"
          echo "### Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 60 build.log
          if [ $STATUS -ne 0 ]; then
            echo "Build failed with exit code $STATUS"
            exit $STATUS
          fi

      - name: Package IPA
        run: |
          echo "=== Locating .app and packaging into IPA ==="
          APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app directory not found"
            find build/DerivedData -type d
            exit 1
          fi

          rm -rf build/Payload InstitutionalApp.ipa
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r ../InstitutionalApp.ipa Payload/
          cd ..
          echo "=== IPA created successfully ==="
          ls -lh InstitutionalApp.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstitutionalApp-iOS-ipa
          path: InstitutionalApp.ipa
          retention-days: 14
