name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Clean extended attributes
        run: |
          xattr -cr .

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Inject Build Number
        run: |
          sed -i '' 's/CFBundleVersion: "1"/CFBundleVersion: "${{ github.run_number }}"/' project.yml
          sed -i '' 's/<string>1<\/string>/<string>${{ github.run_number }}<\/string>/' Sources/InstitutionalApp/Resources/Info.plist

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          ls -la InstitutionalApp.xcodeproj

      - name: Build iOS App (.app)
        run: |
          echo "=== Building InstitutionalApp without signing ==="
          set +e
          xcodebuild build \
            -project InstitutionalApp.xcodeproj \
            -scheme InstitutionalApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO > build.log 2>&1
          STATUS=$?
          echo "xcodebuild exit code: $STATUS"
          tail -n 80 build.log
          if [ $STATUS -ne 0 ]; then
            echo "Build failed with exit code $STATUS"
            exit $STATUS
          fi

      - name: Push build log on failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B build-logs
          git add -f build.log
          git commit -m "chore: build failure log" || true
          git push origin build-logs --force || true

      - name: Package IPA
        run: |
          echo "=== Locating .app and packaging into IPA ==="
          APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app directory not found"
            find build/DerivedData -type d
            exit 1
          fi

          rm -rf build/Payload InstitutionalApp.ipa
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/

          cd build
          zip -r ../InstitutionalApp.ipa Payload/
          cd ..
          echo "=== IPA created successfully ==="
          ls -lh InstitutionalApp.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstitutionalApp-iOS-ipa
          path: InstitutionalApp.ipa
          retention-days: 14

      - name: Prepare Release Assets
        run: |
          cp InstitutionalApp.ipa Empresas.ipa
          # Actualizar apps.json con la fecha y build de esta ejecución
          sed -i '' 's/"versionDescription": ".*"/"versionDescription": "Build ${{ github.run_number }}"/' apps.json

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Empresas iOS v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ## Empresas iOS v1.0.0 (Build ${{ github.run_number }})
            
            Archivo IPA listo para instalar en iPhone/iPad.
            
            ### Métodos de instalación / Actualización:
            1. **SideStore / AltStore**: Agrega el repositorio `apps.json` para actualizaciones inalámbricas automáticas por Wi-Fi sin PC.
            2. **3uTools / Sideloadly**: Firma el archivo `Empresas.ipa` con tu Apple ID personal.
            3. **TrollStore**: Si tu dispositivo lo soporta, instalación directa permanente.
          files: |
            InstitutionalApp.ipa
            Empresas.ipa
            apps.json
