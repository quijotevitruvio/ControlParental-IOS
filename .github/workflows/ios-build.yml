name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          ls -la InstitutionalApp.xcodeproj

      - name: Build & Archive iOS App
        run: |
          echo "=== Archiving InstitutionalApp for iOS ==="
          xcodebuild archive \
            -project InstitutionalApp.xcodeproj \
            -scheme InstitutionalApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/InstitutionalApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          echo "=== Creating Payload and IPA ==="
          rm -rf build/Payload InstitutionalApp.ipa
          mkdir -p build/Payload
          cp -r build/InstitutionalApp.xcarchive/Products/Applications/InstitutionalApp.app build/Payload/
          cd build
          zip -r ../InstitutionalApp.ipa Payload/
          cd ..
          echo "=== Finished IPA ==="
          ls -lh InstitutionalApp.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstitutionalApp-iOS-ipa
          path: InstitutionalApp.ipa
          retention-days: 14
