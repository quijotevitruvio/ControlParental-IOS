name: InstitutionalApp
options:
  bundleIdPrefix: com.institutional
  createIntermediateGroups: true
targets:
  InstitutionalApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/InstitutionalApp
        excludes:
          - Resources/Info.plist
    info:
      path: Sources/InstitutionalApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Empresas"
        CFBundleIdentifier: "com.institutional.supervision"
        CFBundleName: "Empresas"
        CFBundleShortVersionString: "1.45"
        CFBundleVersion: "45"
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: "LaunchScreen"
        UILaunchScreen:
          UILaunchStoryboardName: "LaunchScreen"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationAlwaysAndWhenInUseUsageDescription: "Empresas requiere acceso a la ubicación para supervisión y alertas de zona."
        NSLocationWhenInUseUsageDescription: "Empresas requiere acceso a la ubicación durante el uso del servicio."
        NSCameraUsageDescription: "Empresas requiere acceso a la cámara para escanear códigos QR y para la función SOS."
        NSPhotoLibraryUsageDescription: "Empresas requiere acceso a fotos para sincronizar la galería y evidencia SOS con el panel."
        NSPhotoLibraryAddUsageDescription: "Empresas requiere permiso para guardar capturas de seguridad."
        NSMicrophoneUsageDescription: "Empresas requiere acceso al micrófono para la función SOS."
        BGTaskSchedulerPermittedIdentifiers:
          - com.institutional.supervision.telemetry-refresh
          - com.institutional.supervision.telemetry-processing
        UIBackgroundModes:
          - location
          - fetch
          - processing
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.institutional.supervision
        INFOPLIST_FILE: Sources/InstitutionalApp/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

